<title>For My Wife, Hakima Khatun ❤️</title>
<style>
:root{--gold:#e2bd72;--gold-light:#fff0c4;--gold-dark:#9b7136;--bg:#080807;--panel:#17130e;--text:#f5ead5;--muted:#c8b99e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Georgia,"Noto Serif Bengali","Nirmala UI",serif}
body{min-height:100svh;overflow:hidden;background:radial-gradient(ellipse at 50% 12%,#392918 0,#171109 32%,#080807 75%)}
button{font:inherit}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 10% 80%,#9c6d2820,transparent 30%),radial-gradient(circle at 90% 20%,#d6ad5420,transparent 27%)}

.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #d6b36a25;background:#08080755;backdrop-filter:blur(12px)}

.scene{width:min(760px,100%);max-height:calc(100svh - 112px);overflow:auto;text-align:center;scrollbar-width:none;animation:sceneIn .75s both}
.scene::-webkit-scrollbar{display:none}

.kicker{font:10px Arial,sans-serif;letter-spacing:.26em;color:var(--gold);text-transform:uppercase;margin-bottom:18px}

@keyframes glowOpen{0%{opacity:0;transform:scale(.78) translateY(25px);filter:brightness(2) blur(8px)}65%{opacity:1;transform:scale(1.03);filter:brightness(1.2)}100%{transform:scale(1);filter:none}}
.modalbox .lettertext{text-align:left;white-space:pre-line;line-height:2.05;font-size:16px;color:#eee1ca}
.modalbox h2{font-size:28px}
.close{margin-top:22px}
.envelope{width:170px;height:112px;margin:26px auto 18px;position:relative;background:linear-gradient(145deg,#d9b46d,#8d632c);border-radius:5px;box-shadow:0 0 35px #d5a94b50;cursor:pointer;transition:.4s}
.envelope:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,transparent 49%,#6f4a22 50%,transparent 51%),linear-gradient(215deg,transparent 49%,#8b612e 50%,transparent 51%);z-index:2}
.envelope:after{content:"";position:absolute;left:0;right:0;top:0;margin:auto;width:0;height:0;border-left:85px solid transparent;border-right:85px solid transparent;border-top:64px solid #f0d18c;transform-origin:top;transition:.7s;z-index:3}
.envelope.open:after{transform:rotateX(180deg);opacity:.25}
.seal{position:absolute;z-index:4;left:calc(50% - 16px);top:42px;width:32px;height:32px;border-radius:50%;background:#4a1713;color:#f7d88e;display:grid;place-items:center;box-shadow:0 0 12px #0007}
.cake-wrap{width:190px;height:160px;margin:18px auto;position:relative}
.cake{position:absolute;bottom:10px;left:15px;width:160px;height:78px;border-radius:12px 12px 18px 18px;background:linear-gradient(#e9c77e 0 18%,#6c3d23 18%);box-shadow:0 12px 22px #0008}
.cake:before{content:"";position:absolute;top:-14px;left:0;width:160px;height:28px;border-radius:50%;background:#f2d99c;border-bottom:7px solid #b17b3d}
.candle{position:absolute;z-index:2;bottom:82px;left:89px;width:12px;height:42px;border-radius:4px;background:repeating-linear-gradient(135deg,#f7e6bc 0 6px,#a87a37 6px 10px)}
.flame{position:absolute;bottom:122px;left:87px;width:16px;height:23px;background:radial-gradient(ellipse at 50% 65%,#fff7bc 0 15%,#f5a623 42%,#d34a19 75%,transparent 78%);border-radius:50%;filter:drop-shadow(0 0 12px #ffb52c);animation:flicker .7s infinite alternate}
@keyframes flicker{to{transform:scale(.85) rotate(5deg);opacity:.8}}
.finalmark{font-size:40px;color:var(--gold);text-shadow:0 0 30px #d8ad55}
.heart{position:fixed;bottom:-30px;color:#d6ad61;pointer-events:none;z-index:20;animation:rise 6s linear forwards;opacity:.75}
@keyframes rise{to{transform:translateY(-110vh) rotate(35deg);opacity:0}}
.footerline{font:10px Arial,sans-serif;letter-spacing:.18em;color:#87785f;margin-top:25px}
@media(max-width:520px){.topbar{height:55px;padding:0 14px}main{padding:14px 14px 20px}.scene{max-height:calc(100svh - 85px)}.gift-grid{gap:10px}.gift{min-height:130px}.gift .emoji{font-size:31px}.modalbox{padding:25px 18px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.brand-note{opacity:.8}
.topbar{border-bottom:0;box-shadow:none}
.scene{padding:clamp(4px,1vw,12px);animation:sceneIn .85s cubic-bezier(.2,.75,.2,1) both}
.frame,.gift,.btn,.modalbox{backdrop-filter:blur(10px)}

.gamepanel{max-width:560px;margin:20px auto;padding:20px;border:1px solid #c49b5555;border-radius:22px;background:#17130eaa}

.memory-card.flipped,.memory-card.matched{background:linear-gradient(145deg,#6a4b23,#25190d);transform:rotateY(180deg)}

.reward-stage{padding:12px 4px 4px;perspective:900px}

.reward-box .lid{position:absolute;left:-7px;top:0;width:156px;height:30px;border:1px solid #ffe6a5;border-radius:7px;background:linear-gradient(135deg,#ffe5a0,#bd8436);z-index:3;transform-origin:8% 90%;transition:transform .8s cubic-bezier(.2,.8,.2,1)}

.fingerprint{width:150px;height:150px;border:1px solid #d8b46a88;border-radius:50%;display:grid;place-items:center;margin:22px auto;background:radial-gradient(circle,#3c2b17,#100d09 70%);box-shadow:0 0 35px #d6a84b25;touch-action:none;user-select:none;color:#e9c77e;font-size:78px;cursor:pointer;position:relative}

.fingerprint.scanning{animation:scanPulse .75s infinite alternate;box-shadow:0 0 45px #e2bd7280}

.fingerprint-pair .fingerprint{width:128px;height:128px;margin:8px auto}

.mini-game-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:420px;margin:20px auto}

.tap-heart{font-size:58px;border:1px solid #c49b55;border-radius:50%;width:112px;height:112px;background:radial-gradient(circle,#62451e,#160f09);color:#ffe6a4;cursor:pointer;box-shadow:0 0 30px #d6a84b40;animation:heartPulse 1s infinite alternate}

.arcade-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;max-width:620px;margin:22px auto}

<body>
<canvas id="stars"></canvas><div class="ambient"></div>
<div class="app">
<header class="topbar"><div class="brand">A LITTLE WORLD FOR MY WIFE</div><div class="brand-note">MADE WITH LOVE ✦</div></header>

</div>

<script>
const wife="Hakima Khatun",husband="SK Shayeemuddin";
let step=0,opened=new Set(),candleLit=true,heartScore=0,heartTimer=null,heartTime=10,matched=[],firstCard=null,lockCards=false;
const giftData=[
["একটি ভালোবাসার চিঠি","💌","প্রিয় হাকিমা, আমার জীবনসঙ্গিনী,\n\nসব অনুভূতি হয়তো শব্দে পুরোপুরি বলা যায় না। তবুও আজ তোমার জন্মদিনে বলতে চাই—তুমি আমার জীবনের ভীষণ আপন একজন মানুষ। তোমার হাসি, তোমার কথা, তোমার ছোট ছোট অভিমান—সবকিছুই আমার কাছে আলাদা এক অনুভূতি।\n\nআমি চাই তোমার প্রতিটি সকাল নতুন আশা নিয়ে আসুক। তোমার স্বপ্নগুলো পূরণ হোক, মন খারাপের দিনগুলো সহজ হয়ে যাক। জীবনের প্রতিটি পথে তোমার পাশে এমন একজন মানুষ হয়ে থাকতে চাই, যার কাছে তুমি নির্ভয়ে নিজের মনের কথা বলতে পারো।\n\nআমাদের সব দিন নিখুঁত হবে না, তবুও সম্মান, ধৈর্য আর বোঝাপড়া দিয়ে প্রতিটি দিনকে সুন্দর করে তুলতে চাই। নিজের যত্ন নিও, নিজের স্বপ্নকে ভালোবেসো।\n\nআমি তোমাকে অনেক ভালোবাসি, জান। জীবনের প্রতিটি পথে তোমার পাশে থাকতে চাই—সুখে, দুঃখে, হাসিতে আর কঠিন সময়ে। সারাজীবন তোমার হাতটা ধরে রাখতে চাই, আর প্রতিদিন কাজে-কথায় তোমাকে বুঝিয়ে দিতে চাই তুমি আমার কাছে কতটা আপন।\n\nশুভ জন্মদিন, আমার প্রিয় স্ত্রী।\n\nঅনেক ভালোবাসায়,\nতোমার স্বামী,\n"+husband],
["একগুচ্ছ গোলাপ","🌹","প্রতিটি গোলাপের মতো তোমার জীবনেও ফুটে উঠুক নতুন আনন্দ। তোমার হাসি থাকুক অটুট, মন থাকুক শান্ত, আর প্রতিটি দিন হোক সুন্দর। এই গোলাপগুলো আমার মনের ভালোবাসার ছোট্ট প্রতীক। ❤️"],

const completedGames=new Set();
let resolvingGameKey=false;function gameKeyAtStep(index){if(resolvingGameKey)return null;resolvingGameKey=true;let html='';try{html=scenes[index]()}catch(e){}finally{resolvingGameKey=false}return gameCatalog.find(g=>html.includes(g.marker))?.key||null}
function nextUnfinishedGame(){return gameCatalog.find(g=>!completedGames.has(g.key))||null}
function gameStep(key){const marker=gameCatalog.find(g=>g.key===key)?.marker;if(!marker)return -1;return scenes.findIndex(fn=>{try{return fn().includes(marker)}catch(e){return false}})}
function arcadeStep(){return scenes.findIndex(fn=>{try{return fn().includes('Our private little arcade')}catch(e){return false}})}
function cakeStep(){return scenes.findIndex((fn,i)=>{try{return i>1&&fn().includes('cake-wrap')}catch(e){return false}})}
function enterGame(key){const first=nextUnfinishedGame();if(completedGames.has(key)||first?.key===key){const idx=gameStep(key);if(idx>=0){step=idx;render();window.scrollTo({top:0,behavior:'smooth'});}}else{const note=document.getElementById('arcadeNotice');if(note)note.textContent='আগের খেলাটি জিতে নাও, তারপর পরের খেলাটি খুলবে। ❤️';}}
function nextGame(){const next=nextUnfinishedGame();if(next){enterGame(next.key);return;}step=arcadeStep();render();window.scrollTo({top:0,behavior:'smooth'});}
function renderArcadeState(){const first=nextUnfinishedGame();document.querySelectorAll('.arcade-card[data-game]').forEach(card=>{const key=card.dataset.game;const done=completedGames.has(key);const unlocked=done||first?.key===key;card.disabled=!unlocked;card.classList.toggle('game-locked',!unlocked);card.classList.toggle('game-done',done);const small=card.querySelector('small');if(small)small.textContent=done?'✓ সম্পূর্ণ • আবার খেলতে পারো':unlocked?'এখন খেলো':'আগের গেমের পর খুলবে';});const notice=document.getElementById('arcadeNotice');if(notice)notice.textContent=completedGames.size+'/'+gameCatalog.length+' টি গেম সম্পূর্ণ হয়েছে। '+(completedGames.size===gameCatalog.length?'সব গেম শেষ! এবার পরের অধ্যায়ে চলো।':'একটি করে গেম জিতে পরেরটি আনলক করো।');}
function updateGameNav(){const box=document.getElementById('gameNav');if(!box)return;const key=gameKeyAtStep(step);if(!key)return;const done=completedGames.has(key),next=nextUnfinishedGame();box.innerHTML=`<div class="btnrow navrow"><button class="btn secondary" onclick="step=arcadeStep();render()">♡ গেমের পাতায় ফিরি</button>${done?`<button class="btn" onclick="nextGame()">${next?'পরের খেলায় এগিয়ে যাই →':'সব খেলা শেষ—পরের পাতায় চলো →'}</button>`:`<button class="btn" disabled style="opacity:.55;cursor:not-allowed">খেলাটি জিতলে পরেরটি খুলবে</button>`}</div><p class="hint">${completedGames.size} / ${gameCatalog.length} টি গেম সম্পূর্ণ</p>`;}

const loveQuizRounds=[
 {q:'আমাদের গল্পের শুরুর তারিখ কী?',a:['২৯ আগস্ট ২০২৩','৩০ আগস্ট ২০২৩','১ সেপ্টেম্বর ২০২৩'],correct:'২৯ আগস্ট ২০২৩'},

];
let loveQuizIndex=0;
function loveQuizAnswer(choice){
 const round=loveQuizRounds[loveQuizIndex],feedback=document.getElementById('loveQuizFeedback');
 if(choice!==round.correct){feedback.textContent='একটু ভেবে আবার চেষ্টা করো, জান। তুমি পারবে! ❤️';feedback.style.color='#f1c58a';return;}
 loveQuizIndex++;
 if(loveQuizIndex>=loveQuizRounds.length){feedback.textContent='তিনটি উত্তরই সঠিক! তোমার স্মৃতি অসাধারণ!';reward('Our Love Quiz Champion!','তুমি আমাদের গল্পের তিনটি স্মৃতিই মনে রেখেছো। তোমার জন্য রইল একটি বিশেষ Love Treasure—ভার্চুয়াল গোলাপ, চকলেট আর সারাজীবনের ভালোবাসা! 🌹🍫💝');return;}
 document.getElementById('loveQuizProgress').textContent='ROUND '+(loveQuizIndex+1)+' / 3';
 document.getElementById('loveQuizQuestion').textContent=loveQuizRounds[loveQuizIndex].q;
 document.getElementById('loveQuizOptions').innerHTML=loveQuizRounds[loveQuizIndex].a.map(a=>`<button class="quiz-option" onclick="loveQuizAnswer('${a}')">${a}</button>`).join('');
 feedback.textContent='একটি সঠিক! এবার পরের প্রশ্ন… ❤️';feedback.style.color='#e9d6ae';
}
function unlockLoveCode(){
 const input=document.getElementById('loveCodeInput'),feedback=document.getElementById('loveCodeFeedback');if(!input||!feedback)return;
 if(input.value.replace(/\D/g,'')==='290823'){feedback.textContent='স্মৃতি মিলে গেছে! গোপন উপহার তোমার জন্য খুলছে… 💝';feedback.style.color='#f3d99c';reward('Secret Love Code Unlocked!','সঠিক কোড! ২৯ আগস্ট ২০২৩—আমাদের গল্পের সেই আপন শুরুর স্মৃতি তুমি মনে রেখেছো। তোমার জন্য রইল একটি গোল্ডেন গিফট, গোলাপ আর চকলেট! 🌹🍫');}
 else{feedback.textContent='কোডটি মেলেনি। ইঙ্গিতটা আবার দেখো: ২৯ + ০৮ + ২৩। ❤️';feedback.style.color='#f1c58a';input.focus();}
}

function nav(){const key=gameKeyAtStep(step);if(key)return `<div id="gameNav" class="btnrow navrow"></div>`;if(step===8){const allDone=completedGames.size===gameCatalog.length;return `<div class="btnrow navrow"><button class="btn secondary" onclick="prev()">♡ আগের স্মৃতিতে ফিরি</button>${allDone?`<button class="btn" onclick="goToBirthdayCake()">আগে যাও →</button>`:`<button class="btn" disabled style="opacity:.55;cursor:not-allowed">সব গেম শেষ হলে পরের পাতা খুলবে</button>`}</div>`;}return `<div class="btnrow navrow"><button class="btn secondary" onclick="prev()">← একটু পেছনে ফিরি</button><button class="btn" onclick="next()">আরেকটু এগিয়ে যাই →</button></div>`}
function giftPage(offset){return `<div class="kicker">A little box of happiness</div><h2>তোমার জন্য আরও কিছু উপহার</h2><p>প্রতিটি উপহার খুললে পাবে আমার মনের একেকটি কথা।</p><div class="gift-grid">${giftData.slice(offset*4,offset*4+4).map((g,i)=>gift(offset*4+i,g[1],g[0])).join('')}</div>${nav()}`}
function gift(id,emoji,title){return `<button class="gift ${opened.has(id)?"opened":""}" onclick="openGift(${id})"><span class="emoji">${emoji}</span><b>${title}</b><small>OPEN YOUR GIFT</small></button>`}
function goToBirthdayCake(){const i=scenes.findIndex(fn=>{try{return fn().includes('A little feast made with love')}catch(e){return false}});if(i>=0){step=i;render();window.scrollTo({top:0,behavior:'smooth'});return;}const fallback=cakeStep();if(fallback>=0){step=fallback;render();window.scrollTo({top:0,behavior:'smooth'});}}
function render(){document.getElementById('scene').innerHTML=scenes[step]();renderArcadeState();if(document.getElementById('gameNav'))updateGameNav();if(document.getElementById('loveQuizQuestion')){loveQuizIndex=0;const q=loveQuizRounds[0];document.getElementById('loveQuizProgress').textContent='ROUND 1 / 3';document.getElementById('loveQuizQuestion').textContent=q.q;document.getElementById('loveQuizOptions').innerHTML=q.a.map(a=>`<button class=\"quiz-option\" onclick=\"loveQuizAnswer('${a}')\">${a}</button>`).join('');document.getElementById('loveQuizFeedback').textContent='তিনটি প্রশ্নের উত্তর দাও। ❤️';}if(document.getElementById('memoryBoard'))setupMemory();if(document.querySelector('.choco'))collectChocolates();if(document.getElementById('treasureGrid'))setupTreasure();if(document.getElementById('fingerprintHis')){fingerprintScans=new Set(['his']);document.getElementById('fingerprintHis').classList.add('done');document.getElementById('fingerprintHers').classList.remove('done');document.getElementById('fingerprintHis').innerHTML='<span class="fp-lines">✓</span>';document.getElementById('fingerprintHers').innerHTML='<span class="fp-lines">◎</span>';document.getElementById('fingerprintMatch').textContent='১ / ২ স্ক্যান সম্পূর্ণ';document.getElementById('fingerprintText').textContent='SK Shayeemuddin-এর ডিজিটাল ফিঙ্গারপ্রিন্ট আগে থেকেই নিবন্ধিত। এবার হাকিমার ছাপ দাও। ❤️'}if(document.getElementById('tapHeart')){clearInterval(tapTimer);tapTimer=null;tapScore=0;tapTime=12;const b=document.getElementById('tapHeart');b.disabled=false;b.textContent='♡'}}
function next(){if(step<scenes.length-1){step++;render();burst(10);window.scrollTo({top:0,behavior:'smooth'})}}
function prev(){if(step>0){step--;render();window.scrollTo({top:0,behavior:'smooth'})}}
function restart(){step=0;opened.clear();completedGames.clear();clearInterval(heartTimer);clearInterval(tapTimer);tapTimer=null;render();window.scrollTo({top:0,behavior:'smooth'})}
function openGift(id){opened.add(id);let d=giftData[id];document.getElementById('modalbox').innerHTML=`<div class="kicker">A gift opened just for you</div><div class="ornament">${d[1]}</div><h2>${d[0]}</h2><div class="rule"></div><div class="lettertext">${escapeHTML(d[2])}</div><button class="btn close" onclick="closeModal()">ভালোবাসা রেখে দিলাম ❤️</button>`;showModal();if(step>=2&&step<=4)renderGiftState();burst(16)}

function escapeHTML(t){return t.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function openLetter(){document.getElementById('envelope')?.classList.add('open');document.getElementById('modalbox').innerHTML=`<div class="kicker">A letter from your husband</div><div class="ornament">✉</div><h2>প্রিয় হাকিমা, আমার জীবনসঙ্গিনী</h2><div class="rule"></div><div class="lettertext">${escapeHTML(`প্রিয় হাকিমা,

আজকের এই চিঠিটা উপহারের বাক্সের চিঠির মতো নয়। এখানে আমি কোনো প্রতিশ্রুতির তালিকা লিখতে আসিনি—শুধু তোমার সঙ্গে কাটানো আগামী দিনগুলোর জন্য আমার মনের একটা নরম ইচ্ছে লিখছি।

কখনো খুব সাধারণ একটা বিকেলে একসঙ্গে চা খেতে চাই, কখনো কোনো কারণ ছাড়াই তোমাকে হাসাতে চাই। তোমার ক্লান্ত দিনের শেষে এমন একজন হতে চাই, যার কাছে ফিরে এসে তুমি নিশ্চিন্তে নিজের কথা বলতে পারো।

আমাদের গল্পটা ২০২৩ সালের ২৯ আগস্ট থেকে শুরু—আর আমি চাই, প্রতিটি নতুন দিন সেই গল্পে নতুন সুন্দর পৃষ্ঠা যোগ করুক। আমাদের মধ্যে মতের অমিল হলেও যেন সম্মানটা অটুট থাকে, অভিমান হলেও কথা বলার দরজাটা বন্ধ না হয়।

তোমার স্বপ্নগুলো তোমারই থাকুক, তোমার পরিচয় তোমার নিজের আলোয় উজ্জ্বল হোক। আমি শুধু পাশে থেকে তোমার সাফল্যে হাততালি দিতে চাই, আর কঠিন দিনে সাহস জোগাতে চাই।

শুভ জন্মদিন, আমার প্রিয় স্ত্রী। আল্লাহ তোমাকে ভালো রাখুন, আমাদের সম্পর্কেও রহমত ও বরকত দিন।

আমি তোমাকে অনেক ভালোবাসি, জান। আমি চাই সারা জীবন তোমার পাশে থাকতে, তোমার হাসির কারণ হতে, মন খারাপের দিনে তোমার ভরসা হতে। যত দিন সামনে আসবে, প্রতিদিন নতুন করে তোমাকে ভালোবাসা, সম্মান আর যত্ন দেওয়ার চেষ্টা করব।

function memoryCards(){return ['🌙','🌹','💝','⭐','⭐','💝','🌹','🌙'].map((v,i)=>`<button class="memory-card" data-value="${v}" onclick="flipCard(this)"><span>✦</span></button>`).join('')}
function setupMemory(){matched=[];firstCard=null;lockCards=false;document.querySelectorAll('.memory-card').forEach(c=>{c.classList.remove('flipped','matched');c.disabled=false})}
function flipCard(card){if(lockCards||card.classList.contains('flipped')||card.classList.contains('matched'))return;card.classList.add('flipped');card.innerHTML=card.dataset.value;if(!firstCard){firstCard=card;return}let second=card;if(firstCard.dataset.value===second.dataset.value){firstCard.classList.add('matched');second.classList.add('matched');matched.push(firstCard.dataset.value);firstCard=null;if(matched.length===4){document.getElementById('memoryStatus').textContent='দারুণ! সব জোড়া মিলিয়ে জিতে গেছো!';reward("স্মৃতির খেলায় জয়","তুমি সবগুলো জোড়া খুঁজে পেয়েছো! তোমার জন্য রইল একটি বিশেষ উপহার। 💝")}else document.getElementById('memoryStatus').textContent='একটি জোড়া মিলেছে!';}else{lockCards=true;setTimeout(()=>{firstCard.classList.remove('flipped');second.classList.remove('flipped');firstCard.innerHTML='✦';second.innerHTML='✦';firstCard=null;lockCards=false},750)}}
function luckyBox(n,el){document.querySelectorAll('#scene .gift').forEach(b=>b.disabled=true);el.classList.add('opened');const win=n===3;const msg=win?'জ্যাকপট! তুমি বিশেষ উপহার পেয়েছো! তোমার জন্য রইল গোলাপ, চকলেট আর একগুচ্ছ ভালোবাসা। 🎉🍫🌹':'এই বাক্সে আছে একরাশ শুভকামনা, ভালোবাসা আর দোয়া। তুমি আমার কাছে ভীষণ বিশেষ। ❤️';document.getElementById('luckyResult').textContent=win?'জ্যাকপট! বিশেষ উপহার পেয়েছো! 🎉':'তোমার বাক্সের সারপ্রাইজ খুলছে… ❤️';reward(win?'লাকি বক্স জ্যাকপট!':'তোমার জন্য ছোট্ট উপহার',msg)}

 const c=configs[kind];if(choice===c.correct){reward('সঠিক উত্তর! '+c.title,c.msg)}else{document.getElementById('quizFeedback').textContent='উফ! আরেকবার ভাবো, তুমি পারবে। ❤️';document.getElementById('quizFeedback').style.color='#f1c58a'}
}

function startFingerprint(person){const id=person==='his'?'fingerprintHis':'fingerprintHers';const f=document.getElementById(id);if(!f||fingerprintScans.has(person)||f.classList.contains('scanning'))return;f.classList.add('scanning');f.innerHTML='<span class="fp-lines">◉</span>';document.getElementById('fingerprintText').textContent=(person==='his'?'SK Shayeemuddin-এর':'হাকিমার')+' ডিজিটাল ফিঙ্গারপ্রিন্ট স্ক্যান হচ্ছে…';setTimeout(()=>{f.classList.remove('scanning');f.classList.add('done');f.innerHTML='<span class="fp-lines">✓</span>';fingerprintScans.add(person);document.getElementById('fingerprintMatch').textContent=fingerprintScans.size+' / 2 স্ক্যান সম্পূর্ণ';if(fingerprintScans.size===2){document.getElementById('fingerprintText').textContent='দুটি ডিজিটাল ছাপই মিলেছে! Love Match Successful 💞';burst(24);setTimeout(()=>reward('Love Match Verified','SK Shayeemuddin ও হাকিমা—দুটি আলাদা নাম, কিন্তু একসঙ্গে তৈরি হয়েছে একটি সুন্দর গল্প। তোমাদের জন্য একটি ভার্চুয়াল চকোলেট হামপার, গোলাপ আর অফুরন্ত ভালোবাসা! 🍫🌹❤️'),500)}else{document.getElementById('fingerprintText').textContent='প্রথম স্ক্যান সম্পূর্ণ! এবার অন্যজনের ডিজিটাল ছাপ স্ক্যান করো। ❤️'}},1500)}

let tapScore=0,tapTime=12,tapTimer=null,treasureHearts=new Set(),treasureFound=0,treasureLocked=false;
function tapLoveHeart(){const b=document.getElementById('tapHeart');if(!b)return;if(!tapTimer){tapScore=0;tapTime=12;document.getElementById('tapScore').textContent='0';document.getElementById('tapTime').textContent='12';document.getElementById('tapStatus').textContent='চালিয়ে যাও! তুমি পারবে ❤️';tapTimer=setInterval(()=>{tapTime--;const t=document.getElementById('tapTime');if(t)t.textContent=tapTime;if(tapTime<=0)finishTapGame(tapScore>=10)},1000)}tapScore++;document.getElementById('tapScore').textContent=tapScore;b.textContent=tapScore%2?'♥':'♡';if(tapScore>=10)finishTapGame(true)}

function findHiddenHeart(btn){if(treasureLocked||btn.classList.contains('revealed'))return;const i=Number(btn.dataset.index);btn.classList.add('revealed');if(treasureHearts.has(i)){btn.textContent='💖';treasureFound++;}else btn.textContent='🌙';document.getElementById('treasureStatus').textContent='পাওয়া হৃদয়: '+treasureFound+' / ৩';if(treasureFound===3){treasureLocked=true;reward('লুকানো হৃদয় খুঁজে পেয়েছো!','তুমি তিনটি লুকানো হৃদয়ই খুঁজে পেয়েছো। তোমার জন্য রইল একটি বিশেষ গিফট বক্স, গোলাপ আর চকলেট! 💝🍫🌹')}}

function burst(n){for(let i=0;i<n;i++)setTimeout(makeHeart,i*70)}
function makeHeart(){let e=document.createElement('span');e.className='heart';e.textContent=['♡','✦','♥','✧','✨'][Math.floor(Math.random()*5)];e.style.left=Math.random()*100+'vw';e.style.fontSize=(14+Math.random()*22)+'px';e.style.animationDuration=(4+Math.random()*4)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),8500)}
setInterval(()=>{if(document.hidden)return;let e=document.createElement('span');e.className='ambient-heart';e.textContent=['♡','✧','✦'][Math.floor(Math.random()*3)];e.style.left=Math.random()*100+'vw';e.style.animationDuration=(9+Math.random()*8)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),18000)},1200);
const canvas=document.getElementById('stars'),ctx=canvas.getContext('2d');let W,H,stars=[];
function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;stars=Array.from({length:Math.min(150,Math.floor(innerWidth/3))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3,a:Math.random()*.65+.12,phase:Math.random()*6}))}
function draw(){ctx.clearRect(0,0,W,H);stars.forEach(s=>{s.phase+=.012;ctx.beginPath();ctx.arc(s.x,s.y,s.r*devicePixelRatio,0,Math.PI*2);ctx.fillStyle=`rgba(238,205,139,${s.a*(.65+.35*Math.sin(s.phase))})`;ctx.fill()});requestAnimationFrame(draw)}
addEventListener('resize',resize);resize();draw();render();
</script>
